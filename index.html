<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Future City</title>
</head>
<body>
    <header>
        <div class="logo">Logo</div>

        <div class="titulos">
            <h1>TÍTULO</h1>
            <h2>Secundário</h2>
        </div>

        <div class="login-btn">Entrar</div>
    </header>

    <section class="frase">
        <p>Mensagem introdutória / frase de impacto</p>
    </section>

    <main>
        <div class="ranking-container">

    <div class="rank-item" id="rank1">
        <div class="rank-info">
            <p class="rank-title">1° Lugar - Membro Ouro</p>
            <div class="rank-icon">👤</div>
        </div>
        <div class="rank-bar">
            <div class="bar-fill bar-x"></div>
        </div>
        <p class="points label-x">0 PONTOS</p>
    </div>

    <div class="rank-item" id="rank2">
        <div class="rank-info">
            <p class="rank-title">2° Lugar - Membro Prata</p>
            <div class="rank-icon">👤</div>
        </div>
        <div class="rank-bar">
            <div class="bar-fill bar-y"></div>
        </div>
        <p class="points label-m">0 PONTOS</p>
        </div>
            <div class="rank-item" id="rank3">
                <div class="rank-info">
                    <p class="rank-title">3° Lugar - Membro Bronze</p>
                    <div class="rank-icon">👤</div>
                </div>
                <div class="rank-bar">
                    <div class="bar-fill bar-z"></div>
                </div>
        <p class="points label-y">0 PONTOS</p>
    </div>
</div>
        <section class="postagens">
            <h3>Postagens</h3>
            <!-- Você pode colocar posts aqui -->
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
